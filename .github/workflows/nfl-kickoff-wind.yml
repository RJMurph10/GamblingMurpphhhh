name: NFL kickoff wind

# Fills kickoff wind for finished outdoor NFL games that nflverse left without weather (scripts/nfl/
# kickoff-wind.mjs, Open-Meteo at the stadium), so the ★ wind-under best bets grade on every game.
# Writes props-site/nfl/kickoff-wind.json, read by the site with nflverse's games. Runs daily in season.

on:
  schedule:
    - cron: "41 11 * 1,2,9-12 *"
  workflow_dispatch:
  push:
    branches: [nfl-kickoff-wind]
    paths: [scripts/nfl/kickoff-wind.trigger]

permissions:
  contents: write

concurrency:
  group: props-site-kickoff-wind
  cancel-in-progress: false

jobs:
  wind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kickoff wind
        run: |
          set -e
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch props-site "$url" site
          mkdir -p site/nfl
          node app/scripts/nfl/kickoff-wind.mjs site/nfl/kickoff-wind.json 2022
          cd site
          git config user.name "line-history-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "NFL kickoff wind $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push -q origin props-site; then exit 0; fi
            git pull -q --rebase origin props-site
            sleep $((attempt * 10))
          done
          exit 1
