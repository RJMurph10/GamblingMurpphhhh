name: odds archive probe 2
on: { push: { branches: [ccg-probe4] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A 'Mozilla/5.0' "https://www.sportsbookreviewsonline.com/scoresoddsarchives/ncaafootball/ncaafootballoddsarchives.htm" | grep -oi 'href="[^"]*"' | grep -i "ncaa\|xls\|football" | head -40 | sed 's/^/LINK /'
          curl -s "https://api.github.com/repos/sportsdataverse/cfbfastR-data/contents/betting/csv" | grep -o '"name": "[^"]*"' | head -40 | sed 's/^/GH /'
