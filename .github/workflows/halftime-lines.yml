name: Halftime lines (NFL, NBA)

# Every book's live lines at halftime of each NFL and NBA game: moneyline, spread, total, 2nd-half lines and
# player props (SportsGameOdds free plan), plus ESPN's halftime box score with every player's 1st-half
# stats. One file per game on props-site: halftime/<league>/<espnId>.json (scripts/live/halftime.mjs).
# The NFL and NBA game pages show it in the Props tab's "Halftime live" view while the game is on, and
# it's the data for testing in-game angles.
# Cost: one SportsGameOdds event per game (~16 NFL a week, ~7 NBA a night), from the same 2,500-a-month
# allowance as the other pulls; the job stops when fewer than 30 are left.
# Each run polls ESPN's scoreboard once a minute and exits once no game is before or at halftime within
# the next 100 minutes, so the runs on days without games end right away.
# Needs the repository secret SPORTSGAMEODDS_API_KEY; without it the job does nothing.

on:
  schedule:
    - cron: "45 13 * * 0" # Sunday morning: NFL international games
    - cron: "15 17 * * *" # midday: NFL Sunday 1pm and 4pm games, NBA afternoon games, holiday games
    - cron: "45 23 * * *" # evening: NBA nights, NFL Sunday / Monday / Thursday night games
  workflow_dispatch:
    inputs:
      leagues:
        description: "Leagues (comma-separated)"
        required: false
        default: "NFL,NBA"
      minutes:
        description: "Stop after N minutes"
        required: false
        default: "345"
      sample:
        description: "Only print ESPN's box-score parse for one game, e.g. NFL:401772510 (no SportsGameOdds)"
        required: false
        default: ""
  push:
    branches: [nfl-nba-halftime]
    paths: [scripts/live/halftime.trigger]

permissions:
  contents: write

concurrency:
  group: halftime-lines
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parser check
        if: github.event_name == 'push' || inputs.sample != ''
        run: |
          S="${{ inputs.sample }}"
          if [ -z "$S" ]; then S=$(cat app/scripts/live/halftime.trigger); fi
          node app/scripts/live/halftime.mjs --sample "$S"
      - name: Capture halftime lines
        if: github.event_name != 'push' && inputs.sample == ''
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: |
          set -e
          if [ -z "$SPORTSGAMEODDS_API_KEY" ]; then echo "SPORTSGAMEODDS_API_KEY secret not set; skipping."; exit 0; fi
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch props-site "$url" site-repo
          git -C site-repo config user.name "line-history-bot"
          git -C site-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LEAGUES="${{ inputs.leagues }}"; MIN="${{ inputs.minutes }}"
          node app/scripts/live/halftime.mjs --site site-repo --leagues "${LEAGUES:-NFL,NBA}" --minutes "${MIN:-345}"
