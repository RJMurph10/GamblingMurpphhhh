name: nll odds probe
on: { push: { branches: [nll-odds-probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out && cd out
          python3 - <<'PY'
          import json, urllib.request
          UA={"User-Agent":"Mozilla/5.0"}
          d=json.loads(urllib.request.urlopen(urllib.request.Request("https://site.api.espn.com/apis/site/v2/sports/lacrosse/nll/teams",headers=UA)).read())
          meta={}
          for x in d["sports"][0]["leagues"][0]["teams"]:
              t=x["team"]; meta[t["abbreviation"]]={"id":t["id"],"logos":[(l["rel"],l.get("lastUpdated"),l["href"]) for l in t.get("logos",[])]}
              for i,l in enumerate(t.get("logos",[])):
                  tag="-".join(r for r in l["rel"] if r not in ("full",))
                  if tag not in ("default","primary_logo_on_black_color","primary_logo_on_white_color","secondary_logo_on_black_color"): continue
                  url=l["href"].replace("4096","500") if False else l["href"]
                  try:
                      data=urllib.request.urlopen(urllib.request.Request(l["href"],headers=UA),timeout=30).read()
                      open(f"{t['abbreviation']}__{tag}.png","wb").write(data)
                  except Exception as e: print("ERR",t["abbreviation"],tag,e)
          json.dump(meta,open("meta.json","w"),indent=1)
          for k,v in meta.items(): print(k, [(r[0][-1],r[1][:10] if r[1] else None) for r in v["logos"]])
          PY
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import glob
          for f in glob.glob("*.png"):
              im=Image.open(f); im.thumbnail((256,256)); im.save(f)
          PY
          cd ..
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git fetch -q origin props-site && git checkout -q -B props-site origin/props-site
          rm -rf probes/nll-logos && mkdir -p probes/nll-logos && cp out/* probes/nll-logos/
          git add probes/nll-logos && git commit -qm "probe: NLL logos" && git push -q origin props-site
