name: nll odds probe
on: { push: { branches: [nll-odds-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: ESPN NLL odds
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from datetime import datetime, timedelta, timezone
          UA={"User-Agent":"Mozilla/5.0"}
          g=lambda u: json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read())
          t=datetime.now(timezone.utc)
          rng=f"{(t-timedelta(days=3)).strftime('%Y%m%d')}-{(t+timedelta(days=6)).strftime('%Y%m%d')}"
          d=g(f"https://site.api.espn.com/apis/site/v2/sports/lacrosse/nll/scoreboard?dates={rng}")
          ev=d.get("events",[]); print("events",len(ev))
          for e in ev:
              c=e["competitions"][0]
              print(e["date"], e["name"], e["status"]["type"]["name"], "| scoreboard odds:", json.dumps(c.get("odds"))[:600])
          for e in ev[:12]:
              try:
                  o=g(f"https://sports.core.api.espn.com/v2/sports/lacrosse/leagues/nll/events/{e['id']}/competitions/{e['id']}/odds")
                  items=o.get("items",[])
                  print("CORE", e["name"], "items", len(items))
                  for it in items[:3]:
                      if "$ref" in it: it=g(it["$ref"])
                      print("   ", json.dumps({k:it.get(k) for k in ("provider","details","spread","overUnder","awayTeamOdds","homeTeamOdds","open","close")})[:1500])
              except Exception as x: print("CORE err", e["name"], x)
          PY
