name: nll odds probe
on: { push: { branches: [nll-odds-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time
          from datetime import datetime, timedelta, timezone
          UA={"User-Agent":"GamblingNFL/1.0","Accept":"application/json"}
          S="https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball"
          def g(u):
              t=time.time()
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20); return r.status, json.loads(r.read()), round(time.time()-t,1)
              except urllib.error.HTTPError as e: return e.code, None, round(time.time()-t,1)
              except Exception as e: return str(e), None, round(time.time()-t,1)
          now=datetime.now(timezone.utc)
          for d in range(-1,8):
              day=(now+timedelta(days=d)).strftime("%Y%m%d")
              for lim in (1000,300):
                  st,j,sec=g(f"{S}/scoreboard?dates={day}&groups=50&limit={lim}")
                  ev=(j or {}).get("events",[])
                  print("DAY",day,"limit",lim,"status",st,"secs",sec,"events",len(ev), "live",sum(e["status"]["type"]["state"]=="in" for e in ev),"sched",sum(e["status"]["type"]["state"]=="pre" for e in ev))
          st,j,sec=g(f"{S}/groups"); print("GROUPS",st,sec, len(((j or {}).get("groups") or [{}])[0].get("children",[])) if j else None)
          st,j,sec=g("https://raw.githubusercontent.com/RJMurph10/gamblingnfl/props-site/cbb/season-2026-27.json"); print("SEASON FILE old url",st,sec, (j or {}).get("updated"), len((j or {}).get("games",[])) if j else None)
          st,j,sec=g("https://raw.githubusercontent.com/RJMurph10/GamblingMurpphhhh/props-site/cbb/season-2026-27.json"); print("SEASON FILE new url",st,sec, (j or {}).get("updated"))
          PY
