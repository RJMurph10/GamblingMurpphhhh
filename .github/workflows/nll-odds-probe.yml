name: nll odds probe
on: { push: { branches: [nll-odds-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          UA={"User-Agent":"Mozilla/5.0"}
          B="https://site.api.espn.com/apis/site/v2/sports/lacrosse/nll"
          def g(u):
              try: return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read())
              except Exception as e: return {"ERR":str(e)}
          for q in ("/scoreboard","/scoreboard?dates=20261128-20261130","/scoreboard?dates=20261128-20261204","/scoreboard?dates=2027","/scoreboard?dates=202612","/scoreboard?limit=500&dates=20261101-20270630"):
              d=g(B+q); print("Q",q,"ERR" in d and d["ERR"] or (len(d.get("events",[])), d.get("season"), [e["date"] for e in d.get("events",[])][:3], [e["date"] for e in d.get("events",[])][-2:]))
          t=g(B+"/teams"); T=[x["team"] for x in t["sports"][0]["leagues"][0]["teams"]]
          print("TEAMS",len(T),[(x["id"],x["abbreviation"],x["displayName"],x.get("color"),(x.get("logos") or [{}])[0].get("href")) for x in T])
          s=g(B+f"/teams/{T[0]['id']}/schedule"); ev=s.get("events",[]); print("SCHED",T[0]["displayName"],len(ev), s.get("season"), json.dumps(ev[0])[:1500] if ev else s)
          st=g("https://site.api.espn.com/apis/v2/sports/lacrosse/nll/standings"); print("STAND", json.dumps(st)[:800])
          PY
