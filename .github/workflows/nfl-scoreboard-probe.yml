name: NFL scoreboard probe (research)
on:
  push:
    branches: [nfl-scoreboard-probe]
    paths: [probe/**, .github/workflows/nfl-scoreboard-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npx vitest run probe/schedule-live.test.ts --dir . 2>&1 | tail -80
