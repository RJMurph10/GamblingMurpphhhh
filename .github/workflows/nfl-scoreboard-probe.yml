name: NFL scoreboard probe (research)
on:
  push:
    branches: [nfl-scoreboard-probe]
    paths: [probe/nfl-scoreboard.mjs, .github/workflows/nfl-scoreboard-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe/nfl-scoreboard.mjs
