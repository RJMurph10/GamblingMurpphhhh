name: NFL scoreboard probe (research)
on:
  push:
    branches: [nfl-scoreboard-probe]
    paths: [src/test/zz-probe-schedule-live.test.ts, .github/workflows/nfl-scoreboard-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: npx vitest run src/test/zz-probe-schedule-live.test.ts 2>&1 | tail -80
